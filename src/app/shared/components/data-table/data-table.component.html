<div class="data-table-wrapper">
  @if (caption()) {
    <div class="data-table-caption">{{ caption() }}</div>
  }
  <div class="table-scroll-container">
    <table mat-table [dataSource]="rows()" class="app-mat-table">
      @for (col of columns(); track col.key) {
        <ng-container [matColumnDef]="col.key">
          <th mat-header-cell *matHeaderCellDef class="table-header-cell">
            {{ col.label }}
          </th>
          <td mat-cell *matCellDef="let row" class="table-body-cell">
            {{ row[col.key] }}
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
    </table>
  </div>
</div>
